[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "copper-scar"
version = "0.1.0"
description = "CoreWeave Hacks — Copper Scar: PCBGolf agent loop with Weave spans and scar store"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Philippe Ferreira de sousa" }]
dependencies = [
  "pydantic>=2.0",
]

[project.optional-dependencies]
weave = ["weave>=0.51"]
dev = ["pytest>=8.0", "copper-scar[weave]"]

[project.scripts]
copper-scar = "copper_scar.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["copper_scar*"]

[tool.setuptools.package-data]
copper_scar = ["scars/schema.json", "scars/examples/*.json", "loop/contract.md", "tools/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
